<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stockroom | Inventory</title>
  <style>
    :root { --ink: #17212b; --muted: #64717d; --line: #dbe2e8; --paper: #f7f8f6; --panel: #fff; --teal: #087f8c; --teal-dark: #05616b; --coral: #d65a4a; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: radial-gradient(circle at 100% 0, #dcefee 0, transparent 34%), var(--paper); font: 15px/1.5 Georgia, serif; }
    .wrap { width: min(1120px, calc(100% - 36px)); margin: 0 auto; }
    header { padding: 44px 0 30px; display: flex; justify-content: space-between; align-items: end; gap: 20px; }
    .kicker { color: var(--teal); font: 700 12px/1.2 Arial, sans-serif; letter-spacing: 1.8px; text-transform: uppercase; }
    h1 { margin: 8px 0 0; font-size: clamp(34px, 5vw, 58px); line-height: 1; font-weight: 500; letter-spacing: 0; }
    .summary { color: var(--muted); font: 14px Arial, sans-serif; }
    main { display: grid; grid-template-columns: 330px 1fr; gap: 28px; padding-bottom: 50px; }
    .panel { background: var(--panel); border: 1px solid var(--line); box-shadow: 0 12px 32px #18333d0d; }
    .form-panel { padding: 24px; align-self: start; }
    h2 { margin: 0 0 20px; font: 700 18px Arial, sans-serif; }
    label { display: block; margin: 14px 0 6px; color: var(--muted); font: 12px Arial, sans-serif; }
    input { width: 100%; padding: 11px 12px; border: 1px solid #c9d3da; border-radius: 2px; color: var(--ink); background: #fcfdfd; font: 15px Georgia, serif; }
    input:focus { outline: 2px solid #93d6d8; border-color: var(--teal); }
    .actions { display: flex; gap: 9px; margin-top: 22px; }
    button { border: 0; border-radius: 2px; cursor: pointer; padding: 11px 15px; font: 700 13px Arial, sans-serif; }
    .primary { flex: 1; color: white; background: var(--teal); }
    .primary:hover { background: var(--teal-dark); }
    .secondary { color: var(--ink); background: #e9eef0; }
    .notice { min-height: 22px; margin-top: 12px; color: var(--coral); font: 13px Arial, sans-serif; }
    .list-panel { overflow: hidden; }
    .list-head { display: flex; justify-content: space-between; align-items: center; padding: 23px 24px 15px; border-bottom: 1px solid var(--line); }
    .count { color: var(--teal-dark); font: 700 12px Arial, sans-serif; }
    .item { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; padding: 20px 24px; border-bottom: 1px solid var(--line); }
    .item:last-child { border-bottom: 0; }
    .item-name { margin-bottom: 5px; font-size: 20px; }
    .meta { color: var(--muted); font: 12px Arial, sans-serif; }
    .quantity { margin-bottom: 6px; text-align: right; font: 700 22px Arial, sans-serif; }
    .quantity small { color: var(--muted); font-size: 11px; font-weight: 400; }
    .item-actions { display: flex; justify-content: end; gap: 8px; }
    .edit { color: var(--teal-dark); background: #dff1f0; }
    .remove { color: #9c3329; background: #f8e3e0; }
    .empty { padding: 52px 24px; color: var(--muted); text-align: center; font-size: 18px; }
    @media (max-width: 720px) { header { display: block; } .summary { margin-top: 15px; } main { grid-template-columns: 1fr; } .form-panel { order: 1; } .list-panel { order: 0; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header><div><div class="kicker">Stockroom / 01</div><h1>Inventory</h1></div><div class="summary" id="summary">Keeping the count honest.</div></header>
    <main>
      <section class="panel form-panel">
        <h2 id="form-title">Add an item</h2>
        <form id="item-form">
          <input type="hidden" id="item-id">
          <label for="name">Item name</label><input id="name" required maxlength="100" placeholder="e.g. Wireless keyboard">
          <label for="sku">SKU</label><input id="sku" required maxlength="64" placeholder="e.g. KB-001">
          <label for="quantity">Quantity</label><input id="quantity" type="number" min="0" required placeholder="0">
          <label for="category">Category</label><input id="category" maxlength="60" value="General">
          <div class="actions"><button class="primary" id="submit-button" type="submit">Add to inventory</button><button class="secondary" id="cancel-button" type="button" hidden>Cancel</button></div>
          <div class="notice" id="notice" role="status"></div>
        </form>
      </section>
      <section class="panel list-panel"><div class="list-head"><h2>All items</h2><span class="count" id="count">0 ITEMS</span></div><div id="inventory-list"><div class="empty">Loading inventory...</div></div></section>
    </main>
  </div>
  <script>
    const form = document.querySelector('#item-form');
    const list = document.querySelector('#inventory-list');
    const notice = document.querySelector('#notice');
    const count = document.querySelector('#count');
    const summary = document.querySelector('#summary');
    let items = [];

    function showNotice(message = '', isError = true) { notice.textContent = message; notice.style.color = isError ? 'var(--coral)' : 'var(--teal-dark)'; }
    function resetForm() { form.reset(); document.querySelector('#item-id').value = ''; document.querySelector('#category').value = 'General'; document.querySelector('#form-title').textContent = 'Add an item'; document.querySelector('#submit-button').textContent = 'Add to inventory'; document.querySelector('#cancel-button').hidden = true; }
    function render() {
      count.textContent = `${items.length} ITEM${items.length === 1 ? '' : 'S'}`;
      summary.textContent = `${items.reduce((total, item) => total + item.quantity, 0)} units across ${items.length} ${items.length === 1 ? 'item' : 'items'}.`;
      if (!items.length) { list.innerHTML = '<div class="empty">Your inventory is waiting for its first item.</div>'; return; }
      list.innerHTML = items.map(item => `<article class="item"><div><div class="item-name">${escapeHtml(item.name)}</div><div class="meta">${escapeHtml(item.sku)} &middot; ${escapeHtml(item.category)}</div></div><div><div class="quantity">${item.quantity} <small>units</small></div><div class="item-actions"><button class="edit" data-edit="${item.id}">Edit</button><button class="remove" data-remove="${item.id}">Delete</button></div></div></article>`).join('');
    }
    function escapeHtml(value) { return String(value).replace(/[&<>'"]/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character])); }
    async function loadItems() { try { const response = await fetch('/items'); if (!response.ok) throw new Error('Could not load inventory.'); items = await response.json(); render(); } catch (error) { list.innerHTML = `<div class="empty">${error.message}</div>`; } }
    form.addEventListener('submit', async event => { event.preventDefault(); const id = document.querySelector('#item-id').value; const payload = { name: document.querySelector('#name').value.trim(), sku: document.querySelector('#sku').value.trim(), quantity: Number(document.querySelector('#quantity').value), category: document.querySelector('#category').value.trim() || 'General' }; try { const response = await fetch(id ? `/items/${id}` : '/items', { method: id ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }); const data = await response.json(); if (!response.ok) throw new Error(data.detail || 'Unable to save item.'); showNotice(id ? 'Item updated.' : 'Item added.', false); resetForm(); await loadItems(); } catch (error) { showNotice(error.message); } });
    list.addEventListener('click', async event => { const editId = event.target.dataset.edit; const removeId = event.target.dataset.remove; if (editId) { const item = items.find(entry => entry.id === editId); document.querySelector('#item-id').value = item.id; document.querySelector('#name').value = item.name; document.querySelector('#sku').value = item.sku; document.querySelector('#quantity').value = item.quantity; document.querySelector('#category').value = item.category; document.querySelector('#form-title').textContent = 'Edit item'; document.querySelector('#submit-button').textContent = 'Save changes'; document.querySelector('#cancel-button').hidden = false; window.scrollTo({ top: 0, behavior: 'smooth' }); } if (removeId && confirm('Delete this inventory item?')) { const response = await fetch(`/items/${removeId}`, { method: 'DELETE' }); if (response.ok) { showNotice('Item deleted.', false); await loadItems(); } else showNotice('Unable to delete item.'); } });
    document.querySelector('#cancel-button').addEventListener('click', resetForm);
    loadItems();
  </script>
</body>
</html>
