name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        default: 'production'
        type: choice
        options:
          - development
          - staging
          - production
permissions:
  contents: read
  security-events: write
  
env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
  ECR_REPOSITORY: capstone/my-python-app
  IMAGE_TAG: ${{ github.sha }}

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint flake8 black isort pytest pytest-cov

      - name: Lint - Black code formatting
        run: black --check .
        continue-on-error: true

      - name: Lint - isort import sorting
        run: isort --check-only .
        continue-on-error: true

      - name: Lint - pylint
        run: pylint **/*.py --fail-under=8.0
        continue-on-error: true

      - name: Lint - flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true

      - name: Run unit tests with pytest
        run: |
          pytest test_main.py -v --cov=. --cov-report=xml --cov-report=html
        continue-on-error: true

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit

      - name: Safety - Check vulnerable dependencies
        run: |
          pip install -r requirements.txt
          safety check --json || true
        continue-on-error: true

      - name: Bandit - Security issue scanner
        run: bandit -r . -f json -o bandit-report.json || true
        continue-on-error: true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  build-scan-push:
    name: Build, Scan & Push to ECR
    runs-on: ubuntu-latest
    needs: [dependency-scan]
    if: ${{ (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch' }}
    outputs:
      image-uri: ${{ steps.build-image.outputs.image-uri }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate AWS Secrets
        run: |
          if [ -z "${{ vars.AWS_ACCOUNT_ID }}" ]; then
            echo "❌ ERROR: AWS_ACCOUNT_ID secret is not set"
            echo "Please add AWS_ACCOUNT_ID to GitHub repository secrets"
            exit 1
          fi
          if [ -z "${{ vars.AWS_REGION }}" ]; then
            echo "❌ ERROR: AWS_REGION secret is not set"
            echo "Please add AWS_REGION to GitHub repository secrets"
            exit 1
          fi
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "❌ ERROR: AWS_ACCESS_KEY_ID secret is not set"
            echo "Please add AWS_ACCESS_KEY_ID to GitHub repository secrets"
            exit 1
          fi
          if [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "❌ ERROR: AWS_SECRET_ACCESS_KEY secret is not set"
            echo "Please add AWS_SECRET_ACCESS_KEY to GitHub repository secrets"
            exit 1
          fi
          echo "✅ All AWS secrets are configured correctly"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        id: build-image
        env:
          FULL_IMAGE_URI: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
        run: |
          docker build -t $FULL_IMAGE_URI .
          docker tag $FULL_IMAGE_URI ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          echo "image-uri=$FULL_IMAGE_URI" >> $GITHUB_OUTPUT
          echo "Built image: $FULL_IMAGE_URI"

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.build-image.outputs.image-uri }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

      - name: Run Trivy JSON scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.build-image.outputs.image-uri }}
          format: 'json'
          output: 'trivy-results.json'

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Push image to AWS ECR
        run: |
          docker push ${{ steps.build-image.outputs.image-uri }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Output ECR image details
        run: echo "Image pushed to ${{ steps.build-image.outputs.image-uri }}"

  deploy-to-kind:
    name: Deploy to Kind Cluster
    runs-on: ubuntu-latest
    needs: [build-scan-push]
    if: ${{ (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Kind cluster
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: kind
          node_image: kindest/node:v1.29.0
          wait: 300s

      - name: Verify Kind cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Create ECR Secret for Kind
        run: |
          aws ecr get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}
          kubectl create secret docker-registry ecr-secret \
            --docker-server=${{ env.ECR_REGISTRY }} \
            --docker-username=AWS \
            --docker-password=$(aws ecr get-login-password --region ${{ vars.AWS_REGION }}) \
            --namespace=default || true
            
      - name: Check image URI
        run: |
          echo "IMAGE URI = '${{ needs.build-scan-push.outputs.image-uri }}'"

      - name: Create deployment manifest
        env:
          IMAGE_URI: ${{ needs.build-scan-push.outputs.image-uri }}
        run: |
          cat > deployment.yaml <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: python-app
            labels:
              app: python-app
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: python-app
            template:
              metadata:
                labels:
                  app: python-app
              spec:
                imagePullSecrets:
                - name: ecr-secret
                containers:
                - name: python-app
                  image: ${IMAGE_URI}
                  imagePullPolicy: Always
                  ports:
                  - containerPort: 8000
                  resources:
                    requests:
                      memory: "256Mi"
                      cpu: "250m"
                    limits:
                      memory: "512Mi"
                      cpu: "500m"
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: 8000
                    initialDelaySeconds: 30
                    periodSeconds: 10
                  readinessProbe:
                    httpGet:
                      path: /ready
                      port: 8000
                    initialDelaySeconds: 10
                    periodSeconds: 5
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: python-app-service
          spec:
            type: LoadBalancer
            selector:
              app: python-app
            ports:
            - protocol: TCP
              port: 80
              targetPort: 8000
          EOF
      
      - name: Debug - Show deployment manifest
        run: cat deployment.yaml

      - name: Deploy to Kind cluster
        run: kubectl apply -f deployment.yaml

      - name: Wait for deployment to be ready
        run: |

          kubectl get pods -o wide
          kubectl get svc
          echo "Checking deployment status..."
          kubectl get deployment python-app -o wide
          kubectl get pods -l app=python-app -o wide
          echo "=== Pod Events ==="
          kubectl describe pod -l app=python-app || true
          echo "=== Pod Logs ==="
          kubectl logs -l app=python-app --tail=30 || true
          echo "=== Events ==="
          kubectl get events --sort-by=.lastTimestamp
          kubectl rollout status deployment/python-app --timeout=5m || true

      - name: Run smoke tests
        run: |
          SERVICE_IP=$(kubectl get svc python-app-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "localhost")
          echo "Waiting for service to be ready..."
          sleep 10
          echo "Testing service endpoint..."
          curl -f http://$SERVICE_IP/health || echo "Service not yet accessible"
