name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        default: 'production'
        type: choice
        options:
          - development
          - staging
          - production
      deployment-target:
        description: 'Deployment target cluster'
        required: false
        default: 'kind'
        type: choice
        options:
          - kind
          - ecs
permissions:
  contents: read
  security-events: write
  
env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
  ECR_REPOSITORY: capstone/my-python-app
  IMAGE_TAG: ${{ github.sha }}

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint flake8 black isort pytest pytest-cov

      - name: Lint - Black code formatting
        run: black --check .
        continue-on-error: true

      - name: Lint - isort import sorting
        run: isort --check-only .
        continue-on-error: true

      - name: Lint - pylint
        run: pylint **/*.py --fail-under=8.0
        continue-on-error: true

      - name: Lint - flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true

      - name: Run unit tests with pytest
        run: |
          pytest test_main.py -v --cov=. --cov-report=xml --cov-report=html
        continue-on-error: true

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

  gitleaks-scan:
    name: GitLeaks Secrets Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        id: gitleaks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Gitleaks summary
        if: always()
        run: |
          if [ "${{ steps.gitleaks.outcome }}" = "failure" ]; then
            echo "⚠️  WARNING: Potential secrets detected by gitleaks"
            echo "Review the gitleaks report above for details"
          else
            echo "✅ Gitleaks scan passed - no secrets detected"
          fi

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit

      - name: Safety - Check vulnerable dependencies
        run: |
          pip install -r requirements.txt
          safety check --json || true
        continue-on-error: true

      - name: Bandit - Security issue scanner
        run: bandit -r . -f json -o bandit-report.json || true
        continue-on-error: true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  build-scan-push:
    name: Build, Scan & Push to ECR
    runs-on: ubuntu-latest
    needs: [dependency-scan, gitleaks-scan]
    if: ${{ (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch' }}
    outputs:
      image-uri: ${{ steps.build-image.outputs.image-uri }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate AWS Secrets
        run: |
          if [ -z "${{ vars.AWS_ACCOUNT_ID }}" ]; then
            echo "❌ ERROR: AWS_ACCOUNT_ID secret is not set"
            echo "Please add AWS_ACCOUNT_ID to GitHub repository secrets"
            exit 1
          fi
          if [ -z "${{ vars.AWS_REGION }}" ]; then
            echo "❌ ERROR: AWS_REGION secret is not set"
            echo "Please add AWS_REGION to GitHub repository secrets"
            exit 1
          fi
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "❌ ERROR: AWS_ACCESS_KEY_ID secret is not set"
            echo "Please add AWS_ACCESS_KEY_ID to GitHub repository secrets"
            exit 1
          fi
          if [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "❌ ERROR: AWS_SECRET_ACCESS_KEY secret is not set"
            echo "Please add AWS_SECRET_ACCESS_KEY to GitHub repository secrets"
            exit 1
          fi
          echo "✅ All AWS secrets are configured correctly"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        id: build-image
        env:
          FULL_IMAGE_URI: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
        run: |
          docker build -t $FULL_IMAGE_URI .
          docker tag $FULL_IMAGE_URI ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          echo "image-uri=$FULL_IMAGE_URI" >> $GITHUB_OUTPUT
          echo "Built image: $FULL_IMAGE_URI"

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.build-image.outputs.image-uri }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

      - name: Run Trivy JSON scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.build-image.outputs.image-uri }}
          format: 'json'
          output: 'trivy-results.json'

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Push image to AWS ECR
        run: |
          docker push ${{ steps.build-image.outputs.image-uri }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Output ECR image details
        run: echo "Image pushed to ${{ steps.build-image.outputs.image-uri }}"

  deploy-to-kind:
    name: Deploy to Kind Cluster
    runs-on: ubuntu-latest
    needs: [build-scan-push]
    if: ${{ ((github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.deployment-target == 'kind' || github.event.inputs.deployment-target == ''))) }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Kind cluster
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: kind
          node_image: kindest/node:v1.29.0
          wait: 300s

      - name: Verify Kind cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Create ECR Secret for Kind
        run: |
          aws ecr get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}
          kubectl create secret docker-registry ecr-secret \
            --docker-server=${{ env.ECR_REGISTRY }} \
            --docker-username=AWS \
            --docker-password=$(aws ecr get-login-password --region ${{ vars.AWS_REGION }}) \
            --namespace=default || true
      
      - name: Test ECR access
        run: |
          echo "AWS identity:"
          aws sts get-caller-identity

          echo "Checking ECR repository:"
          aws ecr describe-repositories \
            --repository-names "${ECR_REPOSITORY}" \
            --region "${AWS_REGION}"

          echo "Checking image:"
          aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --region "${AWS_REGION}"

      - name: Check image URI
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          #echo "IMAGE URI = '${{ needs.build-scan-push.outputs.image-uri }}'"
          echo "IMAGE URI = '$IMAGE_URI'"

      - name: Create deployment manifest
        env:
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
        run: |
          cat > deployment.yaml <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: python-app
            labels:
              app: python-app
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: python-app
            template:
              metadata:
                labels:
                  app: python-app
              spec:
                imagePullSecrets:
                - name: ecr-secret
                containers:
                - name: python-app
                  image: ${IMAGE_URI}
                  imagePullPolicy: Always
                  ports:
                  - containerPort: 8000
                  resources:
                    requests:
                      memory: "256Mi"
                      cpu: "250m"
                    limits:
                      memory: "512Mi"
                      cpu: "500m"
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: 8000
                    initialDelaySeconds: 30
                    periodSeconds: 10
                  readinessProbe:
                    httpGet:
                      path: /ready
                      port: 8000
                    initialDelaySeconds: 10
                    periodSeconds: 5
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: python-app-service
          spec:
            type: NodePort
            selector:
              app: python-app
            ports:
            - protocol: TCP
              port: 80
              targetPort: 8000
              nodePort: 30080
          EOF
      
      - name: Debug - Show deployment manifest
        run: cat deployment.yaml

      - name: Deploy to Kind cluster
        run: kubectl apply -f deployment.yaml

      - name: Wait for deployment to be ready
        run: |

          kubectl get pods -o wide
          kubectl get svc
          echo "Checking deployment status..."
          kubectl get deployment python-app -o wide
          kubectl get pods -l app=python-app -o wide
          echo "=== Pod Events ==="
          kubectl describe pod -l app=python-app || true
          echo "=== Pod Logs ==="
          kubectl logs -l app=python-app --tail=30 || true
          echo "=== Events ==="
          kubectl get events --sort-by=.lastTimestamp
          kubectl rollout status deployment/python-app --timeout=5m || true

      - name: Run smoke tests
        run: |
          kubectl get pods -o wide
          kubectl get svc
          kubectl get deployment python-app -o wide
          kubectl logs -l app=python-app --tail=30 || true
          kubectl get events --sort-by=.lastTimestamp
          kubectl get secret ecr-secret
          kubectl get secret ecr-secret -o jsonpath='{.type}'
          kubectl describe pod -l app=python-app || true
          echo "Waiting for deployment..."
          kubectl wait --for=condition=available deployment/python-app --timeout=120s

          echo "Starting port-forward..."
          kubectl port-forward svc/python-app-service 8080:80 > /tmp/port-forward.log 2>&1 &
          PORT_FORWARD_PID=$!
          echo "Port-forward PID: $PORT_FORWARD_PID"

          # Give port-forward a moment to establish
          sleep 3

          echo "Testing /health..."
          curl -f http://localhost:8080/health

          echo
          echo "Testing /ready..."
          curl -f http://localhost:8080/ready

          echo
          echo "✅ Smoke tests passed!"

          kill $PORT_FORWARD_PID || true

  deploy-to-ecs:
    name: Deploy to AWS ECS
    runs-on: ubuntu-latest
    needs: [build-scan-push]
    if: ${{ ((github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch') && github.event.inputs.deployment-target == 'ecs' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Get ECS task definition
        run: |
          TASK_DEFINITION="python-app-task"
          aws ecs describe-task-definition \
            --task-definition $TASK_DEFINITION \
            --region ${{ vars.AWS_REGION }} > task-def.json || echo "Task definition not found, will create new one"

      - name: Create or update ECS task definition
        env:
          CONTAINER_NAME: python-app
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
        run: |
          TASK_ROLE_ARN="${{ secrets.ECS_TASK_ROLE_ARN }}"
          EXECUTION_ROLE_ARN="${{ secrets.ECS_EXECUTION_ROLE_ARN }}"
          
          # Use existing task role or fallback
          TASK_ROLE_ARN=${TASK_ROLE_ARN:-"arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ecsTaskRole"}
          EXECUTION_ROLE_ARN=${EXECUTION_ROLE_ARN:-"arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ecsTaskExecutionRole"}
          
          cat > task-definition.json <<EOF
          {
            "family": "python-app-task",
            "networkMode": "awsvpc",
            "requiresCompatibilities": ["FARGATE"],
            "cpu": "256",
            "memory": "512",
            "containerDefinitions": [
              {
                "name": "$CONTAINER_NAME",
                "image": "$IMAGE_URI",
                "essential": true,
                "portMappings": [
                  {
                    "containerPort": 8000,
                    "protocol": "tcp"
                  }
                ],
                "logConfiguration": {
                  "logDriver": "awslogs",
                  "options": {
                    "awslogs-group": "/ecs/python-app",
                    "awslogs-region": "${{ vars.AWS_REGION }}",
                    "awslogs-stream-prefix": "ecs"
                  }
                },
                "environment": [
                  {
                    "name": "ENVIRONMENT",
                    "value": "${{ github.event.inputs.environment || 'production' }}"
                  }
                ],
                "healthCheck": {
                  "command": ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"],
                  "interval": 30,
                  "timeout": 5,
                  "retries": 3,
                  "startPeriod": 60
                }
              }
            ],
            "taskRoleArn": "$TASK_ROLE_ARN",
            "executionRoleArn": "$EXECUTION_ROLE_ARN"
          }
          EOF
          
          cat task-definition.json

      - name: Register ECS task definition
        run: |
          aws ecs register-task-definition \
            --cli-input-json file://task-definition.json \
            --region ${{ vars.AWS_REGION }}

      - name: Get ECS cluster and service info
        run: |
          CLUSTER_NAME="python-app-cluster"
          SERVICE_NAME="python-app-service"
          
          echo "Checking ECS cluster..."
          aws ecs list-clusters --region ${{ vars.AWS_REGION }} || true
          
          echo "Checking ECS services..."
          aws ecs list-services --cluster $CLUSTER_NAME --region ${{ vars.AWS_REGION }} || true

      - name: Deploy to ECS
        run: |
          CLUSTER_NAME="python-app-cluster"
          SERVICE_NAME="python-app-service"
          TASK_DEFINITION="python-app-task"
          
          # Create cluster if it doesn't exist
          aws ecs create-cluster \
            --cluster-name $CLUSTER_NAME \
            --region ${{ vars.AWS_REGION }} 2>/dev/null || echo "Cluster already exists"
          
          # Check if service exists
          SERVICE_EXISTS=$(aws ecs describe-services \
            --cluster $CLUSTER_NAME \
            --services $SERVICE_NAME \
            --region ${{ vars.AWS_REGION }} \
            --query 'services[0].serviceName' \
            --output text 2>/dev/null || echo "NONE")
          
          if [ "$SERVICE_EXISTS" = "NONE" ]; then
            echo "Creating new ECS service..."
            aws ecs create-service \
              --cluster $CLUSTER_NAME \
              --service-name $SERVICE_NAME \
              --task-definition $TASK_DEFINITION \
              --desired-count 2 \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[],assignPublicIp=ENABLED}" \
              --region ${{ vars.AWS_REGION }}
          else
            echo "Updating existing ECS service..."
            aws ecs update-service \
              --cluster $CLUSTER_NAME \
              --service $SERVICE_NAME \
              --task-definition $TASK_DEFINITION \
              --region ${{ vars.AWS_REGION }}
          fi

      - name: Wait for ECS deployment
        run: |
          CLUSTER_NAME="python-app-cluster"
          SERVICE_NAME="python-app-service"
          
          echo "Waiting for ECS service to stabilize..."
          aws ecs wait services-stable \
            --cluster $CLUSTER_NAME \
            --services $SERVICE_NAME \
            --region ${{ vars.AWS_REGION }} || true
          
          echo "ECS deployment status:"
          aws ecs describe-services \
            --cluster $CLUSTER_NAME \
            --services $SERVICE_NAME \
            --region ${{ vars.AWS_REGION }} \
            --query 'services[0].[serviceName,status,runningCount,desiredCount]' \
            --output table

      - name: Verify deployment
        run: |
          CLUSTER_NAME="python-app-cluster"
          SERVICE_NAME="python-app-service"
          
          echo "Service details:"
          aws ecs describe-services \
            --cluster $CLUSTER_NAME \
            --services $SERVICE_NAME \
            --region ${{ vars.AWS_REGION }}
          
          echo "Task details:"
          TASK_ARN=$(aws ecs list-tasks \
            --cluster $CLUSTER_NAME \
            --service-name $SERVICE_NAME \
            --region ${{ vars.AWS_REGION }} \
            --query 'taskArns[0]' \
            --output text)
          
          if [ ! -z "$TASK_ARN" ] && [ "$TASK_ARN" != "None" ]; then
            aws ecs describe-tasks \
              --cluster $CLUSTER_NAME \
              --tasks $TASK_ARN \
              --region ${{ vars.AWS_REGION }}
          else
            echo "No tasks running yet"
          fi

      - name: Deployment summary
        run: |
          echo "✅ ECS deployment completed!"
          echo ""
          echo "📊 Summary:"
          echo "  - Cluster: python-app-cluster"
          echo "  - Service: python-app-service"
          echo "  - Task Definition: python-app-task"
          echo "  - Image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"
          echo "  - Environment: ${{ github.event.inputs.environment || 'production' }}"
          echo ""
          echo "Next steps:"
          echo "  1. Verify service: aws ecs describe-services --cluster python-app-cluster --services python-app-service"
          echo "  2. View logs: aws logs tail /ecs/python-app"
          echo "  3. Scale: aws ecs update-service --cluster python-app-cluster --service python-app-service --desired-count N"
